<title>That Boy Tough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: pixel arcade. Deep indigo night with a pixel starfield, a console panel with amber
   title and account controls, tabs for Games / Friends / Stats, then cartridge shelves.
   Single dark look by choice. */
:root {
  --bg: #0e0b22;
  --panel: #181437;
  --panel-edge: #34306a;
  --ink: #e6e3fa;
  --muted: #8e89bd;
  --amber: #ffb83d;
  --amber-deep: #b9741a;
  --amber-ink: #2a1700;
  --shell: #221d4a;
  --shell-edge: #3e3980;
  --shadow: #06041a;
  --ledge: #2a2560;
  --ledge-hi: #4a4496;
  --led-off: #2e2a5c;
  --done: #62e08a;
  --lab-ink: #120d2b;
  --pink: #e8607f;
  --danger: #e5484d;
  --danger-deep: #8f1d22;
  --splash-bg: #05040f;
  --scrim: rgba(5, 4, 15, 0.82);
  --font-pixel: "Press Start 2P", "Courier New", ui-monospace, monospace;
  --font-body: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  image-rendering: pixelated;
  pointer-events: none;
}
.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }

/* demo strip */
.demo {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-bottom: 14px;
  padding: 8px 12px;
  border: 2px dashed var(--panel-edge);
  color: var(--muted);
  font-size: 14px;
}
.demo b { font: 400 9px var(--font-pixel); color: var(--lab-ink); background: var(--pink); padding: 4px 6px; }
.demo button { margin-left: auto; }

/* console panel */
.console {
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  box-shadow: 0 6px 0 var(--shadow);
  padding: 20px 18px 18px;
  display: grid;
  gap: 16px;
  margin-bottom: 28px;
}
.console-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.date {
  font-size: 14px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 8px 0 0;
  font-family: var(--font-pixel);
  font-weight: 400;
  font-size: clamp(1rem, 5.4vw, 2.6rem);
  line-height: 1.2;
  color: var(--amber);
  text-shadow: 4px 4px 0 var(--amber-deep);
}
.side { display: grid; justify-items: end; gap: 12px; }
.tally { text-align: right; }
.tally .big { font-family: var(--font-pixel); font-size: clamp(1.2rem, 5vw, 1.8rem); line-height: 1.2; color: var(--amber); font-variant-numeric: tabular-nums; }
.tally .big small { font-size: 0.6em; color: var(--muted); }
.tally .sub { margin-top: 6px; font-size: 14px; letter-spacing: 0.1em; color: var(--muted); }
.tally .sub.all { color: var(--done); }
.leds { display: flex; flex-wrap: wrap; gap: 4px; }
.leds i {
  width: 14px; height: 14px;
  background: var(--led-off);
}
.leds i.on { background: var(--amber); box-shadow: inset 0 -3px 0 var(--amber-deep); }

/* account bar */
.acct { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.who { font-size: 15px; color: var(--muted); }
.who b { color: var(--ink); font-weight: 600; }

/* pixel buttons */
.btn {
  font: 400 10px/1 var(--font-pixel);
  padding: 10px 12px;
  border: 0;
  cursor: pointer;
  background: var(--amber);
  color: var(--amber-ink);
  box-shadow: 0 4px 0 var(--amber-deep);
  text-transform: uppercase;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--amber-deep); }
.btn.danger { background: var(--danger); color: var(--lab-ink); box-shadow: 0 4px 0 var(--danger-deep); }
.btn.danger:active { box-shadow: 0 2px 0 var(--danger-deep); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--panel-edge); box-shadow: none; padding: 8px 10px; }
.btn.ghost:hover { border-color: var(--ledge-hi); }
.btn.small { font-size: 8px; padding: 7px 8px; }
.btn[disabled] { opacity: 0.45; cursor: default; }

/* tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 26px; flex-wrap: wrap; }
.tab {
  font: 400 11px var(--font-pixel);
  padding: 12px 14px;
  background: var(--panel);
  color: var(--muted);
  border: 2px solid var(--panel-edge);
  cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--amber-ink); background: var(--amber); border-color: var(--amber); box-shadow: 0 4px 0 var(--amber-deep); }

/* shelves */
section { margin-bottom: 48px; }
.shelf-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-bottom: 14px; margin-bottom: 18px;
  background: repeating-linear-gradient(90deg, var(--panel-edge) 0 8px, transparent 8px 12px) bottom / 100% 4px no-repeat;
}
h2 {
  display: flex; align-items: center; gap: 10px;
  margin: 0;
  font-family: var(--font-pixel);
  font-weight: 400;
  font-size: clamp(0.78rem, 3.4vw, 1rem);
  line-height: 1.4;
  color: var(--amber);
}
h2::before { content: ""; flex: none; width: 10px; height: 10px; background: var(--amber); }
.sec-count {
  padding: 4px 8px;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--lab-ink);
  background: var(--chip, var(--amber));
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  gap: 18px 14px;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
}
.slot { position: relative; padding-bottom: 14px; min-width: 0; }
.slot::after {
  content: "";
  position: absolute;
  z-index: 2;
  left: -7px; right: -7px; bottom: 0; height: 14px;
  background: linear-gradient(var(--ledge-hi) 0 4px, var(--ledge) 4px);
  box-shadow: 0 4px 0 var(--shadow);
}

/* cartridge */
.cart {
  position: relative;
  z-index: 1;
  background: var(--shell);
  border: 2px solid var(--shell-edge);
}
.face {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 8px;
  padding: 0 8px 8px;
  color: var(--ink);
  text-decoration: none;
  min-height: 176px;
}
.grip {
  height: 16px;
  margin: 0 -8px;
  background: repeating-linear-gradient(90deg, var(--shell-edge) 0 4px, transparent 4px 8px);
}
.label {
  display: grid;
  align-content: center;
  justify-items: center;
  text-align: center;
  gap: 16px;
  padding: 14px 8px;
  background: hsl(var(--h) 85% 62%);
  box-shadow:
    inset 0 4px 0 hsl(var(--h) 90% 78%),
    inset 0 -4px 0 hsl(var(--h) 70% 44%);
  color: var(--lab-ink);
}
.emoji { width: 48px; height: 48px; image-rendering: pixelated; }
.emo { display: grid; place-items: center; }
.emoji-t { font-size: 38px; line-height: 48px; }
.name {
  font-family: var(--font-pixel);
  font-weight: 400;
  font-size: 10px;
  line-height: 1.6;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.face:hover .label { filter: brightness(1.1); }

.cart.insert { animation: insert 0.5s steps(3, end); }
.cart.insert .label { animation: dent 0.5s steps(3, end); }
@keyframes insert {
  0% { transform: translateY(0); }
  30% { transform: translateY(12px); }
  65% { transform: translateY(12px); }
  100% { transform: translateY(0); }
}
@keyframes dent {
  0%, 100% { box-shadow: inset 0 4px 0 hsl(var(--h) 90% 78%), inset 0 -4px 0 hsl(var(--h) 70% 44%); }
  30%, 65% { box-shadow: inset 0 4px 0 hsl(var(--h) 70% 44%), inset 0 -4px 0 hsl(var(--h) 90% 78%); }
}

.check {
  position: absolute;
  z-index: 2;
  top: 3px; right: 6px;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  background: var(--done);
  color: var(--lab-ink);
  border: 2px solid var(--shadow);
  opacity: 0;
  pointer-events: none;
}
.check svg { width: 14px; height: 14px; }
.cart.done .check { opacity: 1; }
.tag {
  position: absolute;
  top: 4px; right: 8px;
  font: 400 8px var(--font-pixel);
  color: var(--muted);
}
/* your logged score, or a log button, sits on the left of the grip */
.mark {
  position: absolute;
  z-index: 2;
  top: 2px; left: 4px;
  font: 400 8px/1 var(--font-pixel);
  padding: 5px 6px;
  border: 2px solid var(--shadow);
  cursor: pointer;
  background: var(--ink);
  color: var(--lab-ink);
}
.mark.log { background: var(--panel); color: var(--amber); border-color: var(--amber); }
.mark.fail { background: var(--pink); }

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
@media (max-width: 380px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; }
  .name { font-size: 9px; }
}

/* panels for friends and stats */
.panels { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: start; margin-bottom: 22px; }
.panel {
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  box-shadow: 0 6px 0 var(--shadow);
  padding: 16px;
  display: grid;
  gap: 12px;
  min-width: 0;
}
.panel.wide { grid-column: 1 / -1; }
.panel h3 { margin: 0; font: 400 11px/1.5 var(--font-pixel); color: var(--amber); }
.panel p { margin: 0; color: var(--muted); }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 14px; justify-items: center; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.code {
  font: 400 14px var(--font-pixel);
  color: var(--ink);
  background: var(--shadow);
  padding: 10px 12px;
  user-select: all;
}
input[type="text"], input[type="number"], select, textarea {
  font: 16px var(--font-body);
  color: var(--ink);
  background: var(--shadow);
  border: 2px solid var(--panel-edge);
  padding: 9px 10px;
  min-width: 0;
}
textarea { width: 100%; min-height: 120px; resize: vertical; }
.msg { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.msg.ok { color: var(--done); }
.msg.bad { color: var(--pink); }

.stand { display: grid; gap: 6px; }
.stand-row {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
  padding: 8px 10px; background: var(--shell); font-variant-numeric: tabular-nums;
}
.stand-row.me { outline: 2px solid var(--amber); outline-offset: -2px; }
.stand-row .rk { font: 400 10px var(--font-pixel); color: var(--muted); }
.stand-row .wins { font: 400 11px var(--font-pixel); color: var(--amber); }
.crown { color: var(--amber); }

.board { display: grid; gap: 4px; }
.brow {
  display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 12px; align-items: center;
  padding: 8px 0;
  border-bottom: 2px dotted var(--panel-edge);
}
.brow:last-child { border-bottom: 0; }
.bgame { font: 400 9px/1.6 var(--font-pixel); text-transform: uppercase; display: flex; gap: 8px; align-items: center; min-width: 0; }
.bgame i { flex: none; width: 10px; height: 10px; background: hsl(var(--h) 85% 62%); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.pchip {
  display: inline-flex; gap: 6px; align-items: baseline;
  padding: 4px 8px; background: var(--shell); font-size: 15px; font-variant-numeric: tabular-nums;
}
.pchip .n { color: var(--muted); font-size: 13px; }
.pchip b { font-weight: 700; }
.pchip.first { background: var(--amber); color: var(--amber-ink); }
.pchip.first .n { color: var(--amber-ink); }
.pchip.me:not(.first) { outline: 2px solid var(--amber); outline-offset: -2px; }
.pchip.x b { color: var(--pink); }
.pchip.first.x b { color: var(--amber-ink); }
@media (max-width: 560px) { .brow { grid-template-columns: 1fr; gap: 6px; } }

.friend-list { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 4px 4px 10px; background: var(--shell); }
.fchip button { background: none; border: 0; color: var(--muted); cursor: pointer; font: 400 10px var(--font-pixel); padding: 4px 6px; }
.fchip button:hover { color: var(--pink); }

.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { background: var(--shell); padding: 12px; display: grid; gap: 6px; }
.tile .v { font: 400 20px var(--font-pixel); color: var(--amber); font-variant-numeric: tabular-nums; }
.tile .k { font-size: 14px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 2px dotted var(--panel-edge); white-space: nowrap; }
th { font: 400 8px var(--font-pixel); color: var(--muted); text-transform: uppercase; }
td.num, th.num { text-align: right; }

/* modal */
.modal {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  background: var(--scrim);
  padding: 16px;
}
.dialog {
  width: min(100%, 480px);
  max-height: calc(100% - 16px);
  overflow-y: auto;
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  box-shadow: 0 8px 0 var(--shadow);
  padding: 18px;
  display: grid;
  gap: 14px;
}
.dialog h3 { margin: 0; font: 400 13px/1.5 var(--font-pixel); color: var(--amber); }
.dialog p { margin: 0; color: var(--muted); }
.dialog .row > input[type="text"] { flex: 1; }
.sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.sep::before, .sep::after { content: ""; flex: 1; height: 2px; background: var(--panel-edge); }
.btn.google { background: var(--ink); color: var(--lab-ink); box-shadow: 0 4px 0 var(--muted); width: 100%; padding: 13px; }
.parsed {
  display: grid; gap: 10px;
  padding: 12px; background: var(--shell);
}
.parsed .row label { font-size: 14px; color: var(--muted); }
.parsed select { flex: 1; }
.parsed input[type="number"] { width: 110px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* log pop-up */
.taps { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.tapn {
  font: 400 16px var(--font-pixel);
  height: 52px;
  border: 0;
  cursor: pointer;
  background: var(--shell);
  color: var(--ink);
  box-shadow: inset 0 -4px 0 var(--shell-edge), 0 4px 0 var(--shadow);
}
.tapn:hover { background: var(--ledge-hi); }
.tapn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--shell-edge), 0 2px 0 var(--shadow); }
.tapn.x { color: var(--pink); }
.tapn.more { font-size: 11px; }
.tapn.cur { background: var(--amber); color: var(--amber-ink); box-shadow: inset 0 -4px 0 var(--amber-deep), 0 4px 0 var(--shadow); }
.dialog input[type="number"] { flex: 1; }
.mark.stamp { animation: stamp 0.6s steps(4, end); }
@keyframes stamp {
  0% { transform: scale(2.2) rotate(-8deg); }
  50% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
/* friends' scores you can't see until you log yours */
.locked { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
.locked .dots { letter-spacing: 3px; color: var(--ledge-hi); }

/* boot-up splash */
.splash {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 26px;
  background: var(--splash-bg);
  font-family: var(--font-pixel);
  cursor: default;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  transition: opacity 0.3s;
}
.splash.out { opacity: 0; }
.splash::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px);
  pointer-events: none;
}
.boot {
  width: min(100%, 420px);
  min-height: 8em;
  white-space: pre-wrap;
  font-size: 9px;
  line-height: 2;
  color: var(--muted);
}
.s-title {
  font-size: clamp(1.5rem, 6.6vw, 3.2rem);
  line-height: 1.5;
  text-align: center;
  text-wrap: balance;
  color: var(--amber);
  text-shadow: 4px 4px 0 var(--amber-deep);
}
.s-title .ch { opacity: 0; }
.s-title .ch.on { opacity: 1; }
.s-bar { display: flex; gap: 4px; width: min(100%, 420px); }
.s-bar i { flex: 1; height: 16px; background: var(--led-off); }
.s-bar i.on { background: hsl(var(--h) 85% 62%); }
.s-sprite {
  width: 64px;
  height: 64px;
  image-rendering: pixelated;
  animation: bob 0.8s steps(2) infinite;
}
.s-sprite .b { fill: var(--shell-edge); }
.s-sprite .l { fill: var(--amber); }
.s-sprite .h { fill: var(--ink); }
.s-sprite .p { fill: var(--muted); }
@keyframes bob { 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<canvas id="stars" aria-hidden="true"></canvas>

<div class="splash" id="splash">
  <svg class="s-sprite" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
    <rect class="b" x="2" y="2" width="12" height="13"/>
    <rect class="b" x="3" y="1" width="1" height="1"/>
    <rect class="b" x="5" y="1" width="1" height="1"/>
    <rect class="b" x="7" y="1" width="1" height="1"/>
    <rect class="b" x="9" y="1" width="1" height="1"/>
    <rect class="b" x="11" y="1" width="1" height="1"/>
    <rect class="l" x="4" y="5" width="8" height="6"/>
    <rect class="h" x="5" y="6" width="3" height="1"/>
    <rect class="p" x="4" y="15" width="8" height="1"/>
  </svg>
  <div class="boot" id="splash-boot" aria-hidden="true"></div>
  <div class="s-title" id="splash-title" aria-hidden="true"></div>
  <div class="s-bar" id="splash-bar" aria-hidden="true"></div>
</div>

<div class="wrap">
  <div class="demo" id="demo">
    <b>DEMO</b>
    <span>Accounts, friends and scores are simulated in this browser. Sam, Alex, Jordan and Maya are sample players.</span>
    <button class="btn ghost small" id="demo-reset" type="button">Reset demo</button>
  </div>

  <div class="console">
    <div class="console-top">
      <div>
        <div class="date" id="date"></div>
        <h1>THAT BOY TOUGH</h1>
      </div>
      <div class="side">
        <div class="acct" id="acct"></div>
        <div class="tally">
          <div class="big"><span id="done-n">0</span><small> / <span id="total-n">0</span></small></div>
          <div class="sub" id="status"></div>
        </div>
      </div>
    </div>
    <div class="leds" id="leds" aria-hidden="true"></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-games" aria-selected="true" data-view="games">GAMES</button>
    <button class="tab" role="tab" id="tab-friends" aria-selected="false" data-view="friends">FRIENDS</button>
    <button class="tab" role="tab" id="tab-stats" aria-selected="false" data-view="stats">MY STATS</button>
  </div>

  <main id="view-games"><div id="groups"></div></main>
  <main id="view-friends" hidden></main>
  <main id="view-stats" hidden></main>
</div>

<div class="modal" id="modal" hidden>

function fmtScore(game, s) {
  var sc = game.score, max = sc.max;
  if (s.failed) return "X" + (sc.type === "guesses" && max ? "/" + max : "");
  var v = sc.type === "points" ? Number(s.value).toLocaleString() : s.value;
  return v + (max ? "/" + max.toLocaleString() : "") + (sc.type === "points" && !max ? " pts" : "");
}
// negative when a is better than b
function cmpScore(game, a, b) {
  if (a.failed && b.failed) return 0;
  if (a.failed) return 1;
  if (b.failed) return -1;
  var lowerWins = game.score.type === "guesses" || game.score.low;
  return lowerWins ? a.value - b.value : b.value - a.value;
}

var DEMO_KEY = "tbt-demo-v1";
var SAMPLE = {
  sam:    { code: "TBT-5A3C1E", skill: 0.75 },
  alex:   { code: "TBT-9F02BD", skill: 0.55 },
  jordan: { code: "TBT-41E7A0", skill: 0.65 },
  maya:   { code: "TBT-C8D25F", skill: 0.85 }
};

function seeded(str) {
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    var t = (h ^= h >>> 16) >>> 0;
    return t / 4294967296;
  };
}
function fakeScore(who, skill, game, day) {
  var r = seeded(who + "|" + game.id + "|" + day);
  if (r() > 0.72) return null;
  var sc = game.score, q = Math.pow(r(), 1 + skill * 1.5);
  if (sc.type === "guesses") {
    var max = sc.max || 10;
    if (r() < 0.12 * (1.2 - skill)) return { value: null, failed: true };
    return { value: 1 + Math.floor(q * (max - 1)), failed: false };
  }
  if (sc.low) return { value: 5 + Math.floor(q * 300), failed: false };
  var top = sc.max || 1000;
  var v = Math.round(top * (1 - q * 0.75));
  if (top >= 1000) v = Math.round(v / (top >= 10000 ? 10 : 1));
  if (top >= 10000) v *= 10;
  return { value: Math.max(0, Math.min(top, v)), failed: false };
}

var FIREBASE_CONFIG = {

var FIREBASE_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

async function connectFirebase() {
  var A = await import(FIREBASE_SDK + "firebase-app.js");
  var U = await import(FIREBASE_SDK + "firebase-auth.js");
  var F = await import(FIREBASE_SDK + "firebase-firestore.js");
  var app = A.initializeApp(FIREBASE_CONFIG);
  var auth = U.getAuth(app);
  var db = F.getFirestore(app);
  function ref() { return F.doc.apply(null, [db].concat(Array.prototype.slice.call(arguments))); }
  function col() { return F.collection.apply(null, [db].concat(Array.prototype.slice.call(arguments))); }
  function uid() { return auth.currentUser && auth.currentUser.uid; }
  async function ignore(p) { try { await p; } catch (e) {} }

  // Coming back from a Google redirect (used when pop-ups are blocked)
  await ignore(U.getRedirectResult(auth));
  await new Promise(function (res) { var off = U.onAuthStateChanged(auth, function () { off(); res(); }); });

  var profile = null, lastFriends = [];

  return {
    isDemo: false,

    session: async function () {
      if (!auth.currentUser) { profile = null; return null; }
      if (!profile || profile.id !== uid()) {
        var snap = await F.getDoc(ref("users", uid()));
        if (!snap.exists()) return { needsUsername: true };
        profile = { id: uid(), username: snap.data().username, code: snap.data().code };
      }
      return profile;
    },
    signInWithGoogle: async function () {
      var provider = new U.GoogleAuthProvider();
      try {
        await U.signInWithPopup(auth, provider);
        return {};
      } catch (e) {
        if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return { cancelled: true };
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
          await U.signInWithRedirect(auth, provider);
          return { redirect: true };
        }
        return { error: "Google sign-in didn't work (" + e.code + "). Try again." };
      }
    },
    claimUsername: async function (name) {
      if ((await F.getDoc(ref("usernames", name))).exists()) return { error: "That username is taken. Try another." };
      for (var tries = 0; tries < 3; tries++) {
        var bytes = new Uint8Array(3);
        crypto.getRandomValues(bytes);
        var code = "TBT-" + Array.prototype.map.call(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("").toUpperCase();
        var batch = F.writeBatch(db);
        batch.set(ref("usernames", name), { uid: uid() });
        batch.set(ref("codes", code), { uid: uid(), username: name });
        batch.set(ref("users", uid()), { username: name, code: code, createdAt: F.serverTimestamp() });
        try {
          await batch.commit();
          profile = { id: uid(), username: name, code: code };
          return { user: profile };
        } catch (e) {
          if ((await F.getDoc(ref("usernames", name))).exists()) return { error: "That username was just taken. Try another." };
        }
      }
      return { error: "Couldn't save your username. Try again." };
    },
    signOut: async function () { profile = null; lastFriends = []; await U.signOut(auth); },

    myScores: async function () {
      var out = {};
      var snap = await F.getDocs(F.query(col("users", uid(), "scores"), F.where("day", ">=", dayKey(-365))));
      snap.forEach(function (d) {
        var s = d.data();
        out[s.day] = out[s.day] || {};
        out[s.day][s.game] = { value: s.value, failed: s.failed, raw: s.raw || "" };
      });
      return out;
    },
    saveScore: async function (gameId, day, s) {
      await F.setDoc(ref("users", uid(), "scores", day + "_" + gameId), {
        game: gameId, day: day, value: s.failed ? null : s.value, failed: !!s.failed, raw: s.raw || "", at: F.serverTimestamp()
      });
    },
    deleteScore: async function (gameId, day) {
      await F.deleteDoc(ref("users", uid(), "scores", day + "_" + gameId));
    },

    // Adding a friend writes both lists at once. "pending" only shows up for a friendship
    // that one side hasn't finished (older requests), and it fixes itself when they visit.
    friends: async function () {
      var me = uid(), list = [];
      var snap = await F.getDocs(col("users", me, "friends"));
      await Promise.all(snap.docs.map(async function (d) {
        var back = await F.getDoc(ref("users", d.id, "friends", me));
        list.push({ id: d.id, username: d.data().username, pending: !back.exists() });
      }));
      list.sort(function (a, b) { return a.username < b.username ? -1 : 1; });
      lastFriends = list;
      return list;
    },
    // Friend requests from before adding was instant: accept them automatically.
    acceptRequests: async function () {
      var me = uid();
      var snap = await F.getDocs(F.query(col("requests"), F.where("to", "==", me)));
      await Promise.all(snap.docs.map(async function (d) {
        await F.setDoc(ref("users", me, "friends", d.data().from), { username: d.data().fromName });
        await ignore(F.deleteDoc(d.ref));
      }));
    },
    addFriend: async function (code) {
      var me = uid();
      code = code.trim().toUpperCase();
      if (!/^TBT-[0-9A-F]{6}$/.test(code)) return { error: "Codes look like TBT-5A3C1E." };
      if (profile && code === profile.code) return { error: "That's your own code." };
      var c = await F.getDoc(ref("codes", code));
      if (!c.exists()) return { error: "No player has that code. Check it and try again." };
      var them = c.data().uid, name = c.data().username;
      if (lastFriends.some(function (f) { return f.id === them; })) return { error: "@" + name + " is already on your list." };
      // their code is what lets you add yourself to their list (checked by the security rules)
      var batch = F.writeBatch(db);
      batch.set(ref("users", me, "friends", them), { username: name, code: code });
      batch.set(ref("users", them, "friends", me), { username: profile.username, code: code });
      await batch.commit();
      await ignore(F.deleteDoc(ref("requests", them + "_" + me)));
      await ignore(F.deleteDoc(ref("requests", me + "_" + them)));
      return { ok: "You and @" + name + " are now friends." };
    },
    removeFriend: async function (fid) {
      var me = uid();
      await F.deleteDoc(ref("users", me, "friends", fid));

      await ignore(F.deleteDoc(ref("requests", me + "_" + fid)));
      await ignore(F.deleteDoc(ref("requests", fid + "_" + me)));
    },
    friendScores: async function (days, friends) {
      var out = {};
      await Promise.all((friends || []).map(async function (f) {
        out[f.id] = {};
        var snap = await F.getDocs(F.query(col("users", f.id, "scores"), F.where("day", ">=", days[0])));
        snap.forEach(function (d) {
          var s = d.data();
          out[f.id][s.day] = out[f.id][s.day] || {};
          out[f.id][s.day][s.game] = { value: s.value, failed: s.failed };
        });
      }));
      return out;
    }
  };
}

    sec.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "grid";
    g.games.forEach(function (game) {
      var slot = document.createElement("div");
      slot.className = "slot";
      var cart = document.createElement("div");
      cart.className = "cart";
      cart.dataset.id = game.id;
      cart.style.setProperty("--h", game.hue);

      var a = document.createElement("a");
      a.className = "face";
      a.href = game.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = '<span class="grip"></span><span class="label"><span class="emo"></span><span class="name"></span></span>';
      a.querySelector(".emo").appendChild(pixelEmoji(game.emoji));
      a.querySelector(".name").textContent = game.name;
      cart.appendChild(a);
      a.addEventListener("pointerdown", function () { pressFx(cart); });
      a.addEventListener("click", function () { pressFx(cart); trackGame(game); });
      a.addEventListener("auxclick", function (e) { if (e.button === 1) trackGame(game); });

      if (game.isDaily) {
        var c = document.createElement("span");
        c.className = "check";
        c.setAttribute("aria-hidden", "true");
        c.innerHTML = CHECK_SVG;
        cart.appendChild(c);
        var mark = function () { markOpened(game.id); };
        a.addEventListener("click", mark);
        a.addEventListener("auxclick", mark);
      } else {
        var t = document.createElement("span");
        t.className = "tag";
        t.textContent = "ANY TIME";
        cart.appendChild(t);
      }
      if (game.score) {
        var mk = document.createElement("button");
        mk.type = "button";
        mk.className = "mark";
        mk.hidden = true;
        mk.addEventListener("click", function () { openLog(game.id); });
        cart.appendChild(mk);
      }
      slot.appendChild(cart);
      grid.appendChild(slot);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });
}

function markOpened(id) {
  rollover();
  if (!state.done[id]) {
    state.done[id] = true;
    save();
  }
  paint();
}
function rollover() {
  if (state.date !== todayKey()) {
    state = { date: todayKey(), done: {} };
    save();
    WEEK = [-6, -5, -4, -3, -2, -1, 0].map(dayKey);
    refresh();
  }
}

function paint() {
  var total = dailyGames.length;
  var n = 0;
  dailyGames.forEach(function (x) { if (state.done[x.id]) n++; });

  document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  document.getElementById("done-n").textContent = n;
  document.getElementById("total-n").textContent = total;

  var status = document.getElementById("status");
  var left = total - n;
  status.className = "sub" + (left === 0 ? " all" : "");
  status.textContent = left === 0 ? "ALL OPENED TODAY" : left + " LEFT TODAY";

  var leds = document.getElementById("leds");
  if (leds.children.length !== total) {
    leds.innerHTML = "";
    for (var i = 0; i < total; i++) leds.appendChild(document.createElement("i"));
  }
  for (var j = 0; j < leds.children.length; j++) leds.children[j].className = j < n ? "on" : "";

  var today = myScores[todayKey()] || {};
  allGames.forEach(function (game) {
    var cart = document.querySelector('.cart[data-id="' + game.id + '"]');
    var isDone = game.isDaily && !!state.done[game.id];
    cart.classList.toggle("done", isDone);
    cart.querySelector(".face").setAttribute("aria-label", "Play " + game.name + (isDone ? " (opened today)" : ""));
    var mk = cart.querySelector(".mark");
    if (!mk) return;
    var s = today[game.id];
    mk.hidden = !me;
    mk.className = "mark" + (s ? (s.failed ? " fail" : "") : " log");
    mk.textContent = s ? fmtScore(game, s) : "+ LOG";
    mk.setAttribute("aria-label", s ? "Your " + game.name + " score today: " + fmtScore(game, s) + ". Edit" : "Log your " + game.name + " score");
  });

  document.querySelectorAll(".sec-count").forEach(function (el) {
    var g = GROUPS.filter(function (x) { return x.name === el.dataset.group; })[0];
    var daily = g.games.filter(function (x) { return x.isDaily; });
    var d = daily.filter(function (x) { return state.done[x.id]; }).length;
    el.textContent = d + "/" + daily.length + " opened";
  });
}

/* ---------------------------------------------------------------------------

   ------------------------------------------------------------------------- */
function players() {
  var list = [{ id: me.id, username: me.username, isMe: true, scores: myScores }];
  friendList.forEach(function (f) { if (!f.pending) list.push({ id: f.id, username: f.username, isMe: false, scores: friendScoreMap[f.id] || {} }); });
  return list;
}
// For one game on one day: who played, best first, with shared ranks for ties.
function rankGame(game, day, people) {
  var rows = [];
  people.forEach(function (p) {
    var s = (p.scores[day] || {})[game.id];
    if (s) rows.push({ p: p, s: s });
  });
  rows.sort(function (a, b) { return cmpScore(game, a.s, b.s); });
  rows.forEach(function (r, i) {
    r.rank = i > 0 && cmpScore(game, rows[i - 1].s, r.s) === 0 ? rows[i - 1].rank : i + 1;
  });
  return rows;
}
// A "win" is finishing first (ties included) in a game at least two of you played.
function winsOn(day, people) {
  var w = {};
  people.forEach(function (p) { w[p.id] = 0; });
  scoredGames.forEach(function (g) {
    var rows = rankGame(g, day, people);
    if (rows.length < 2) return;
    rows.forEach(function (r) { if (r.rank === 1 && !r.s.failed) w[r.p.id]++; });
  });
  return w;
}

function renderFriends() {
  var el = document.getElementById("view-friends");
  if (!me) { el.innerHTML = signInPrompt("PLAY WITH FRIENDS"); return; }
  var people = players();
  var today = todayKey();

  var week = {}, todayW = winsOn(today, people);
  people.forEach(function (p) { week[p.id] = 0; });
  WEEK.forEach(function (d) {
    var w = winsOn(d, people);
    Object.keys(w).forEach(function (k) { week[k] += w[k]; });
  });
  var standing = people.slice().sort(function (a, b) { return week[b.id] - week[a.id] || todayW[b.id] - todayW[a.id]; });

  var h = '<div class="panels">';

  h += '<div class="panel"><h3>THIS WEEK</h3><p>Wins over the last 7 days. You win a game by finishing first among friends who played it.</p><div class="stand">';
  standing.forEach(function (p, i) {
    var rk = i > 0 && week[standing[i - 1].id] === week[p.id] ? "" : "#" + (i + 1);
    h += '<div class="stand-row' + (p.isMe ? " me" : "") + '"><span class="rk">' + rk + '</span>' +
      '<span>' + (i === 0 && week[p.id] > 0 ? '<span class="crown">♛ </span>' : "") + '@' + esc(p.username) + (p.isMe ? " (you)" : "") +
      ' <span class="n" style="color:var(--muted)">· ' + todayW[p.id] + ' today</span></span>' +
      '<span class="wins">' + week[p.id] + '</span></div>';
  });
  h += '</div></div>';

  h += '<div class="panel"><h3>FRIENDS</h3>';
  h += '<p>Share your code, or add a friend with theirs. You\'ll both see each other\'s scores right away.</p>';
  h += '<div class="row"><span class="code" id="my-code">' + esc(me.code) + '</span><button class="btn ghost small" type="button" id="copy-code">Copy</button></div>';
  h += '<div class="row"><input type="text" id="add-code" placeholder="Friend code, e.g. TBT-5A3C1E" autocomplete="off" aria-label="Friend code"><button class="btn small" type="button" id="add-btn">Add</button></div>';
  h += '<div class="msg" id="add-msg"></div>';
  h += '<div class="friend-list">';
  if (!friendList.length) h += '<p>' + (api.isDemo ? "No friends yet. Try the code TBT-C8D25F." : "No friends yet. Add one with their code.") + '</p>';
  friendList.forEach(function (f) {
    h += '<span class="fchip">@' + esc(f.username) + (f.pending ? ' <span style="color:var(--muted)">· waiting</span>' : '') + ' <button type="button" data-remove="' + esc(f.id) + '" data-name="' + esc(f.username) + '" aria-label="Remove ' + esc(f.username) + '">✕</button></span>';
  });
  h += '</div></div>';

  h += '<div class="panel wide"><h3>TODAY\'S BOARD</h3><p>Friends\' scores for a game stay hidden until you log yours.</p>';
  var rowsHtml = "", mineToday = myScores[today] || {};
  scoredGames.forEach(function (g) {
    var rows = rankGame(g, today, people);
    if (!rows.length) return;
    rowsHtml += '<div class="brow"><div class="bgame" style="--h:' + g.hue + '"><i></i>' + esc(g.name) + '</div>';
    if (!mineToday[g.id]) {
      var n = rows.length;
      rowsHtml += '<div class="locked"><span class="dots" aria-hidden="true">▮▮▮</span>' + n + (n === 1 ? " friend" : " friends") + ' played' +
        '<button class="mark log" style="position:static" type="button" data-log="' + g.id + '">+ LOG</button></div></div>';
      return;
    }
    rowsHtml += '<div class="chips">';
    rows.forEach(function (r) {
      var cls = "pchip" + (r.rank === 1 && rows.length > 1 && !r.s.failed ? " first" : "") + (r.p.isMe ? " me" : "") + (r.s.failed ? " x" : "");
      rowsHtml += '<span class="' + cls + '"><span class="n">' + r.rank + '</span>@' + esc(r.p.username) + ' <b>' + esc(fmtScore(g, r.s)) + '</b></span>';
    });
    rowsHtml += '</div></div>';
  });
  h += rowsHtml ? '<div class="board">' + rowsHtml + '</div>' : '<p>Nobody has logged a score today yet.</p>';
  h += '</div></div>';

  el.innerHTML = h;

  document.getElementById("copy-code").onclick = function () {
    var b = this;
    var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1500); };
    try {
      navigator.clipboard.writeText(me.code).then(done, function () { selectText("my-code"); });
    } catch (e) { selectText("my-code"); }
  };
  var add = async function () {
    var input = document.getElementById("add-code"), msg = document.getElementById("add-msg");
    if (!input.value.trim()) { msg.className = "msg bad"; msg.textContent = "Type a friend code first."; return; }
    var r;
    try { r = await api.addFriend(input.value); }
    catch (e) { console.error(e); r = { error: "Couldn't add that friend. Check your connection and try again." }; }
    if (r.error) { msg.className = "msg bad"; msg.textContent = r.error; return; }
    await refresh();
    var m2 = document.getElementById("add-msg");
    m2.className = "msg ok"; m2.textContent = r.ok;
  };
  document.getElementById("add-btn").onclick = add;
  document.getElementById("add-code").onkeydown = function (e) { if (e.key === "Enter") add(); };
  el.querySelectorAll("[data-remove]").forEach(function (b) {
    b.onclick = function () { confirmRemove(b.dataset.remove, b.dataset.name); };
  });
  el.querySelectorAll("[data-log]").forEach(function (b) {

/* ---------------------------------------------------------------------------
   Stats view: your own history
   ------------------------------------------------------------------------- */
function renderStats() {
  var el = document.getElementById("view-stats");
  if (!me) { el.innerHTML = signInPrompt("TRACK YOUR STATS"); return; }

  var total = 0, perGame = {};
  Object.keys(myScores).forEach(function (day) {
    Object.keys(myScores[day]).forEach(function (gid) {
      if (!gameIndex[gid] || !gameIndex[gid].score) return;
      total++;
      (perGame[gid] = perGame[gid] || []).push(myScores[day][gid]);
    });
  });
  // streak: consecutive days with at least one logged score, counting back from today
  // (or from yesterday, so the streak doesn't look broken before today's first log)
  var streak = 0, off = (myScores[todayKey()] && Object.keys(myScores[todayKey()]).length) ? 0 : -1;
  while (true) {
    var d = myScores[dayKey(off)];
    if (!d || !Object.keys(d).length) break;
    streak++; off--;
  }
  var people = players(), weekWins = 0;
  WEEK.forEach(function (d) { weekWins += winsOn(d, people)[me.id] || 0; });

  var h = '<div class="panels"><div class="panel wide"><h3>@' + esc(me.username) + '</h3><div class="tiles">' +
    '<div class="tile"><span class="v">' + total + '</span><span class="k">scores logged</span></div>' +
    '<div class="tile"><span class="v">' + streak + '</span><span class="k">day streak</span></div>' +
    '<div class="tile"><span class="v">' + weekWins + '</span><span class="k">wins this week</span></div>' +
    '<div class="tile"><span class="v">' + Object.keys(perGame).length + '/' + scoredGames.length + '</span><span class="k">games played</span></div>' +
    '</div></div>';

  h += '<div class="panel wide"><h3>BY GAME</h3>';
  var ids = scoredGames.filter(function (g) { return perGame[g.id]; });
  if (!ids.length) {
    h += '<p>No scores yet. Tap + LOG on a cartridge after you play.</p>';
  } else {
    h += '<div class="tbl-wrap"><table><thead><tr><th>Game</th><th class="num">Played</th><th class="num">Best</th><th class="num">Average</th><th class="num">Solved</th></tr></thead><tbody>';
    ids.forEach(function (g) {
      var list = perGame[g.id];
      var ok = list.filter(function (s) { return !s.failed; });
      var best = list.slice().sort(function (a, b) { return cmpScore(g, a, b); })[0];
      var avg = ok.length ? ok.reduce(function (t, s) { return t + Number(s.value); }, 0) / ok.length : null;
      var avgTxt = avg === null ? "–" : (g.score.type === "guesses" ? avg.toFixed(1) : Math.round(avg).toLocaleString());
      h += '<tr><td>' + esc(g.name) + '</td><td class="num">' + list.length + '</td><td class="num">' + esc(fmtScore(g, best)) + '</td><td class="num">' + avgTxt + '</td>' +
        '<td class="num">' + (g.score.type === "guesses" ? Math.round(100 * ok.length / list.length) + "%" : "–") + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div></div>';
  el.innerHTML = h;
}

// Log pop-up for one game. Guess games: tap the number of guesses (or X) and it saves.
// Points games: type the number.
function openLog(gameId) {
  var g = gameIndex[gameId];
  if (!g || !g.score) return;
  var sc = g.score, existing = (myScores[todayKey()] || {})[g.id];
  var tapMax = sc.type === "guesses" ? (sc.max || 8) : 0;

  var body = "";
  if (tapMax) {
    body += '<p>How many guesses?' + (sc.max ? "" : " Tap X if you didn't get it.") + '</p><div class="taps" role="group" aria-label="Guesses">';
    for (var i = 1; i <= tapMax; i++) {
      body += '<button type="button" class="tapn' + (existing && !existing.failed && existing.value === i ? " cur" : "") + '" data-v="' + i + '">' + i + '</button>';
    }
    if (!sc.max) body += '<button type="button" class="tapn more" id="lg-more" aria-label="More than ' + tapMax + '">' + (tapMax + 1) + '+</button>';
    body += '<button type="button" class="tapn x' + (existing && existing.failed ? " cur" : "") + '" data-v="X" aria-label="Didn\'t solve it">X</button></div>';
    body += '<div class="row" id="lg-more-row" hidden><input type="number" id="lg-value" min="1" inputmode="numeric" aria-label="Number of guesses"><button class="btn" type="button" id="lg-save">Save</button></div>';
  } else {
    body += '<p>' + (sc.low ? "Your points (lower wins)" : "Your points") + (sc.max ? " out of " + sc.max.toLocaleString() : "") + '</p>';
    body += '<div class="row"><input type="number" id="lg-value" min="0" inputmode="numeric" aria-label="Points" value="' + (existing && !existing.failed ? existing.value : "") + '"><button class="btn" type="button" id="lg-save">Save</button></div>';
  }
  body += '<div class="msg" id="lg-msg"></div>';

  openModal(
    '<h3 id="dlg-title">LOG · ' + esc(g.name.toUpperCase()) + '</h3>' + body +
    '<div class="dlg-actions">' + (existing ? '<button class="btn ghost small" type="button" id="lg-del">Delete score</button>' : '') +
    '<button class="btn ghost small" type="button" id="lg-cancel">Cancel</button></div>',
    tapMax ? null : "lg-value");
  var first = dialog.querySelector(".tapn");
  if (first) first.focus();

  var msg = document.getElementById("lg-msg");
  function bad(t) { msg.className = "msg bad"; msg.textContent = t; }
  async function commit(value, failed) {
    if (!failed) {
      if (!isFinite(value) || value < 0 || (sc.type === "guesses" && value < 1)) return bad("Enter a number" + (sc.type === "guesses" ? " of guesses, 1 or more." : ", 0 or more."));
      if (sc.max && value > sc.max) return bad(g.name + " goes up to " + sc.max.toLocaleString() + ".");
    }
    try { await api.saveScore(g.id, todayKey(), { value: value, failed: failed }); }
    catch (e) { console.error(e); return bad("Couldn't save your score. Check your connection and try again."); }
    if (g.isDaily && !state.done[g.id]) { state.done[g.id] = true; save(); }
    closeModal();
    await refresh();
    stamp(g.id);
  }

  dialog.querySelectorAll(".tapn[data-v]").forEach(function (b) {
    b.onclick = function () { b.dataset.v === "X" ? commit(null, true) : commit(Number(b.dataset.v), false); };
  });
  var more = document.getElementById("lg-more");
  if (more) more.onclick = function () {
    document.getElementById("lg-more-row").hidden = false;
    document.getElementById("lg-value").focus();
  };
  var val = document.getElementById("lg-value");
  var saveBtn = document.getElementById("lg-save");
  if (saveBtn) {
    var go = function () { if (val.value === "") return bad("Type your score first."); commit(Number(val.value), false); };
    saveBtn.onclick = go;
    val.onkeydown = function (e) { if (e.key === "Enter") go(); };
  }

  document.getElementById("lg-cancel").onclick = closeModal;
  if (existing) document.getElementById("lg-del").onclick = async function () {
    await api.deleteScore(g.id, todayKey()); closeModal(); refresh();
  };
}

// Little pixel "stamp" on the cartridge's score tag after saving.
function stamp(gameId) {
  var mk = document.querySelector('.cart[data-id="' + gameId + '"] .mark');
  if (!mk) return;
  mk.classList.remove("stamp");
  void mk.offsetWidth;
  mk.classList.add("stamp");
  setTimeout(function () { mk.classList.remove("stamp"); }, 700);
}

/* pixel starfield, drawn at one third resolution so every star is a 3px square */
function drawStars() {
  var c = document.getElementById("stars");
  var w = c.width = Math.ceil(window.innerWidth / 3);
  var h = c.height = Math.ceil(window.innerHeight / 3);
  var x = c.getContext("2d");
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var count = Math.floor(w * h / 220);
  for (var i = 0; i < count; i++) {
    var r = rnd();
    x.fillStyle = r > 0.92 ? "#ffb83d" : (r > 0.6 ? "#9d96e8" : "#4a4496");
    x.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * h), 1, 1);
  }
}
var starTimer = null;
window.addEventListener("resize", function () { clearTimeout(starTimer); starTimer = setTimeout(drawStars, 150); });

/* boot-up splash: plays once per day for 4 seconds, no skip */
var SPLASH_KEY = "games-hub-splash-v1";
var SPLASH_TEXT = "THAT BOY TOUGH";
var splash = document.getElementById("splash");
var sTitle = document.getElementById("splash-title");
var sBar = document.getElementById("splash-bar");
var sBoot = document.getElementById("splash-boot");
var splashDone = true, splashTimers = [];

function later(fn, ms) { splashTimers.push(setTimeout(fn, ms)); }

function endSplash() {
  if (splashDone) return;
  splashDone = true;
  splashTimers.forEach(clearTimeout);
  splashTimers = [];
  splash.classList.add("out");
  setTimeout(function () {
    splash.hidden = true;
    splash.classList.remove("out");
    document.documentElement.style.overflow = "";
  }, 320);
  try { localStorage.setItem(SPLASH_KEY, todayKey()); } catch (e) {}
}

function playSplash() {
  splashDone = false;
  splash.classList.remove("out");
  splash.hidden = false;
  document.documentElement.style.overflow = "hidden";

  sTitle.innerHTML = "";
  for (var i = 0; i < SPLASH_TEXT.length; i++) {
    var ch = SPLASH_TEXT.charAt(i);
    if (ch === " ") { sTitle.appendChild(document.createTextNode(" ")); continue; }
    var s = document.createElement("span");
    s.className = "ch";
    s.textContent = ch;
    sTitle.appendChild(s);
  }
  sBar.innerHTML = "";
  for (var k = 0; k < allGames.length; k++) {
    var seg = document.createElement("i");
    seg.style.setProperty("--h", HUES[k % HUES.length]);
    sBar.appendChild(seg);
  }
  var chars = sTitle.querySelectorAll(".ch");
  var segs = sBar.children;
  sBoot.textContent = "> POWER ON_";

  later(function () { sBoot.textContent = "> POWER ON\n> RAM CHECK... OK_"; }, 450);
  later(function () { sBoot.textContent = "> POWER ON\n> RAM CHECK... OK\n> LOADING CARTRIDGES_"; }, 1100);
  Array.prototype.forEach.call(chars, function (c, n) {
    later(function () { c.classList.add("on"); }, 900 + n * 110);
  });
  Array.prototype.forEach.call(segs, function (sg, n) {
    later(function () { sg.classList.add("on"); }, 1300 + n * 90);
  });
  later(function () {
    sBoot.textContent = "> POWER ON\n> RAM CHECK... OK\n> LOADING CARTRIDGES\n> " + segs.length + " CARTRIDGES READY";
  }, 3200);
  later(endSplash, 3700);
}

(function () {
  var seen = "";
  try { seen = localStorage.getItem(SPLASH_KEY) || ""; } catch (e) {}
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (seen === todayKey() || reduce) { splash.hidden = true; } else { playSplash(); }
})();
